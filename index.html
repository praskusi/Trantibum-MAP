<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRANTIBUM MAP KUANSING</title>

  <!-- Leaflet CSS Resmi -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background-color: #e5e3df;
      z-index: 1;
    }
    /* Panel Judul */
    .title-panel {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 16px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      border-left: 5px solid #d9534f;
    }
    .title-panel h1 {
      margin: 0;
      font-size: 15px;
      color: #2c3e50;
      font-weight: 700;
    }
    .title-panel p {
      margin: 2px 0 0;
      font-size: 11px;
      color: #555;
    }
    /* Legenda */
    .legend {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      font-size: 12px;
      line-height: 1.6;
      color: #333;
    }
    .legend h4 {
      margin: 0 0 5px 0;
      font-size: 12px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
      padding-bottom: 3px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      margin-bottom: 3px;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    /* Popup */
    .popup-box {
      width: 220px;
      font-size: 12px;
      line-height: 1.45;
    }
    .popup-box img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 5px;
      margin-bottom: 6px;
      border: 1px solid #ddd;
      display: block;
    }
    .popup-box h4 {
      margin: 0 0 4px 0;
      font-size: 13px;
      color: #1a252f;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 5px;
    }
    .badge-tinggi { background-color: #d9534f; }
    .badge-sedang { background-color: #f0ad4e; }
    .badge-rendah { background-color: #5cb85c; }
  </style>
</head>
<body>

  <div class="title-panel">
    <h1>TRANTIBUM MAP KUANSING</h1>
    <p>Peta Kerawanan Trantibum - Satpol PP Kuansing</p>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS Resmi -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. Buat Peta
    var map = L.map('map', {
      center: [-0.5317, 101.5583],
      zoom: 14
    });

    // 2. Basemap Google Maps Roads & OSM
    var googleRoads = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Maps'
    }).addTo(map);

    var googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      attribution: '&copy; Google Satellite'
    });

    var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    });

    // 3. Layer Groups
    var layerTinggi = L.layerGroup().addTo(map);
    var layerSedang = L.layerGroup().addTo(map);
    var layerRendah = L.layerGroup().addTo(map);

    // 4. Data Titik
    var daftarTitik = [
      {
        nama: "Pasar Tradisional Teluk Kuantan",
        lat: -0.5306,
        lng: 101.5645,
        radius: 350,
        tingkat: "Tinggi",
        foto: "img/pasar.jpeg",
        potensi: "PKL Meluber ke Badan Jalan & Parkir Liar",
        waktu: "Pagi & Sore (06.30 - 10.00 WIB)",
        tindakan: "Patroli Penataan & Pengawasan Rutin",
        status: "Perlu Pengawasan Intensif"
      },
      {
        nama: "Taman Jalur / Tepian Narosa",
        lat: -0.5321,
        lng: 101.5630,
        radius: 250,
        tingkat: "Sedang",
        foto: null,
        potensi: "Aktivitas Pengamen/PMKS & Sampah Liar",
        waktu: "Malam Hari (19.30 - 23.00 WIB)",
        tindakan: "Patroli Dialogis Humanis",
        status: "Terkendali"
      },
      {
        nama: "Kompleks Perkantoran Pemkab Kuansing",
        lat: -0.5480,
        lng: 101.5680,
        radius: 400,
        tingkat: "Rendah",
        foto: null,
        potensi: "Monitoring Kepatuhan Disiplin Jam Kerja",
        waktu: "Jam Kerja (09.00 - 11.30 WIB)",
        tindakan: "Monitoring Berkala Penegakan Perda",
        status: "Aman Terpantau"
      }
    ];

    function getWarna(tingkat) {
      if (tingkat === 'Tinggi') return '#d9534f';
      if (tingkat === 'Sedang') return '#f0ad4e';
      return '#5cb85c';
    }

    function getBadge(tingkat) {
      if (tingkat === 'Tinggi') return 'badge-tinggi';
      if (tingkat === 'Sedang') return 'badge-sedang';
      return 'badge-rendah';
    }

    // 5. Tambahkan Titik & Radius
    daftarTitik.forEach(function(item) {
      var warna = getWarna(item.tingkat);

      var zona = L.circle([item.lat, item.lng], {
        radius: item.radius,
        color: warna,
        weight: 1.5,
        fillColor: warna,
        fillOpacity: 0.25
      });

      var titik = L.circleMarker([item.lat, item.lng], {
        radius: 6,
        color: '#ffffff',
        weight: 2,
        fillColor: warna,
        fillOpacity: 1
      });

      var imgHtml = item.foto ? '<img src="' + item.foto + '" alt="' + item.nama + '" onerror="this.style.display=\'none\'" />' : '';

      var isiPopup = '<div class="popup-box">' +
        imgHtml +
        '<span class="badge ' + getBadge(item.tingkat) + '">Rawan ' + item.tingkat + '</span>' +
        '<h4>' + item.nama + '</h4>' +
        '<b>Radius:</b> ±' + item.radius + ' Meter<br>' +
        '<b>Potensi:</b> ' + item.potensi + '<br>' +
        '<b>Waktu:</b> ' + item.waktu + '<br>' +
        '<b>Tindakan:</b> ' + item.tindakan + '<br>' +
        '<b>Status:</b> <i>' + item.status + '</i>' +
        '</div>';

      zona.bindPopup(isiPopup);
      titik.bindPopup(isiPopup);

      if (item.tingkat === "Tinggi") {
        zona.addTo(layerTinggi);
        titik.addTo(layerTinggi);
      } else if (item.tingkat === "Sedang") {
        zona.addTo(layerSedang);
        titik.addTo(layerSedang);
      } else {
        zona.addTo(layerRendah);
        titik.addTo(layerRendah);
      }
    });

    // 6. Kontrol Layer
    var baseMaps = {
      "Google Peta Jalan": googleRoads,
      "Google Satelit": googleHybrid,
      "OpenStreetMap": osmLayer
    };

    var overlayMaps = {
      "<span style='color:#d9534f; font-weight:bold;'>● Zona Rawan Tinggi</span>": layerTinggi,
      "<span style='color:#f0ad4e; font-weight:bold;'>● Zona Rawan Sedang</span>": layerSedang,
      "<span style='color:#5cb85c; font-weight:bold;'>● Zona Rawan Rendah</span>": layerRendah
    };

    L.control.layers(baseMaps, overlayMaps, { collapsed: false, position: 'topright' }).addTo(map);

    // 7. Legenda
    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      var div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<h4>Zona Kerawanan</h4>' +
        '<div class="legend-row"><span class="legend-color" style="background:#d9534f;"></span> Tinggi (Prioritas)</div>' +
        '<div class="legend-row"><span class="legend-color" style="background:#f0ad4e;"></span> Sedang (Pengawasan)</div>' +
        '<div class="legend-row"><span class="legend-color" style="background:#5cb85c;"></span> Rendah (Monitoring)</div>';
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
